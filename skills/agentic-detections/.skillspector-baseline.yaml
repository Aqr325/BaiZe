# SkillSpector baseline — agentic-detections
#
# Baseline suppresses known-accepted findings so re-scans surface only NEW
# issues. Applied automatically via `skillspector scan <skill> --use-shipped-baseline`.
#
# Scope: ALL findings below are FALSE POSITIVES. This is a READ-ONLY defensive
# detection rule library (ThreatDefence/agentic-attack-detections, MIT) — it
# ships YARA/Sigma/Suricata/KQL/Zeek rules + threat-intel indicators that
# legitimately REFERENCE attack signatures (malware, C2, obfuscation, cloud
# metadata, privileged k8s, credential flows, agent config dirs, anti-refusal
# strings, self-modification patterns). A generic anti-tamper scanner misreads
# these detection signatures as "the skill is the attack". The skill never runs
# scripts or modifies files (see SKILL.md). Verified manually 2026-11-24.
#
# Real supply-chain findings (SC1/SC4 — unpinned/advisory deps in
# tools/requirements.txt) are deliberately NOT listed here so they stay visible
# and actionable (pin versions in tools/).

