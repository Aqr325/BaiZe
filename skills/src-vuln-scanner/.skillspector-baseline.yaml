# SkillSpector baseline — src-vuln-scanner
#
# Baseline suppresses known-accepted findings so re-scans surface only NEW
# issues. Applied automatically via `skillspector scan <skill> --use-shipped-baseline`.
#
# Scope: ALL findings below are FALSE POSITIVES — a legitimate source-code
# vulnerability scanner that reads credential config to validate findings, and
# declares its tool scope in SKILL.md. Verified manually 2026-11-24. No real
# findings present.

version: 2
scanner_version: "2.12.0"

rules:
  - id: "LP3"
    reason: "Accepted: scanner declares tool scope in SKILL.md; intent documented"

  - id: "PE3"
    reason: "False positive: vuln scanner reads credential config to validate findings, not to steal credentials"
