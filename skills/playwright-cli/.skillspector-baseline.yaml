# issues. Applied automatically via `skillspector scan <skill> --use-shipped-baseline`.
#
# Scope: ALL findings below are FALSE POSITIVES — a Playwright browser-
# automation CLI. It manages browser storage state (memory manipulation),
# references container images, and uploads first-party results. Verified
# manually 2026-11-24. No real findings present.

version: 2
scanner_version: "2.12.0"

rules:
