# SkillSpector baseline — api-recon
#
# Baseline suppresses known-accepted findings so re-scans surface only NEW
# issues. Applied automatically via `skillspector scan <skill> --use-shipped-baseline`.
#
# Scope: ALL findings below are FALSE POSITIVES — a generic anti-tamper scanner
# judging legitimate penetration-reconnaissance tooling. Verified manually
# 2026-11-24. Real supply-chain findings (SC1 unpinned deps in package.json)
# are deliberately NOT listed here so they stay visible and actionable.
#
# See tools/skillspector/docs/SUPPRESSION.md for rule semantics: a finding is
# suppressed when every field a rule sets glob-matches it; unspecified fields
# match anything.

version: 2
scanner_version: "2.12.0"

rules:
  # api-recon reads target authentication material to run legal recon
  # validation — the scanner misreads credential->network as exfiltration.
  - id: "TT3"
    reason: "False positive: recon tool reads target creds for authorized validation, not exfiltration (harvest_static.py/spider_mpa.py)"

  # The tool writes runtime-generated artifacts (results dir) referenced by SKILL.md.
  - id: "AE1"
    reason: "False positive: incomplete referenced artifact is a runtime-generated output dir, benign"

  # Declared permission surface is intentionally broad for a recon CLI; intent is
  # documented in SKILL.md and scoped by CLI flags.
  - id: "LP3"
    reason: "Accepted: recon CLI declares broad tool access; intent documented in SKILL.md"

  # Telemetry/result upload to configured endpoint is first-party, not exfiltration.
  - id: "E1"
    reason: "Accepted: first-party result/telemetry upload to configured endpoint"

  # Runtime-generated artifact references.
  - id: "EA1"
    reason: "Accepted: runtime-generated artifact references"

  # Subprocess/exec of the wrapped recon tools is the tool's core function.
  - id: "TM3"
    reason: "Accepted: wrapping external recon tools is the tool's purpose"

  # Dynamic import / subprocess are the tool's mechanism to drive its recon backends.
  - id: "AST3"
    reason: "Accepted: dynamic import drives plugin backends"

  - id: "AST4"
    reason: "Accepted: subprocess drives wrapped recon tools"

  # Error-path file references.
  - id: "E2"
    reason: "Accepted: benign error-path file reference"

  # Real findings deliberately NOT suppressed (kept visible for remediation):
  #   SC1  — unpinned dependencies in scripts/package.json (npm audit fix)
